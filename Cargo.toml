[package]
name = "mcp2cli"
version = "0.1.0"
edition = "2021"
description = "Turn any MCP server or OpenAPI spec into a CLI — at runtime, with zero codegen"
license = "MIT"
readme = "README.md"
repository = "https://github.com/knowsuchagency/mcp2cli"
keywords = ["mcp", "cli", "openapi", "ai"]
categories = ["command-line-utilities"]

[[bin]]
name = "mcp2cli"
path = "src/bin/mcp2cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Wired in subsequent milestones; keep in tree so feature work compiles early.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "blocking", "stream", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time"] }
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "auth",
] }
shell-words = "1"
http = "1"
futures = "0.3"
sse-stream = "0.2"
url = "2"
async-trait = "0.1"
open = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
